name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  site:
    name: site-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML/CSS/manifest references
        run: python3 scripts/check-site.py

  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required pages and repo files exist
        run: |
          set -euo pipefail
          for f in \
            public/index.html \
            public/get-started/index.html \
            public/architecture/index.html \
            public/security/index.html \
            public/about/index.html \
            public/robots.txt \
            public/sitemap.xml \
            public/site.webmanifest \
            README.md \
            SECURITY.md \
            LICENSE-MIT \
            LICENSE-APACHE
          do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "structure ok"
